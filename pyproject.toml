[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognocient"
version = "0.1.3"
description = "Drop-in async-reporting wrapper for the OpenAI and Anthropic Python SDKs — live cost attribution without changing your base_url."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
dev = ["pytest>=7.0", "openai>=1.0", "anthropic>=0.25"]

[project.urls]
Homepage = "https://github.com/mandarvshinde/cognocient-python-wrapper"
Repository = "https://github.com/mandarvshinde/cognocient-python-wrapper"
Documentation = "https://cognocient.com/docs/python-wrapper"
Issues = "https://github.com/mandarvshinde/cognocient-python-wrapper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cognocient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
